[project]
name = "ctl"
version = "2.0.0"
description = "Full control of your environment"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "20C", email = "code@20c.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "confu>=1.4",
    "grainy>=1.4",
    "munge>=1",
    "natsort>=8",
    "pluginmgr>=1.2.1",
    "semver<=3",
    "GitPython>=3.1.36",
    "ogr>=0.46.0",
    "pydantic>=2.3.0",
]

[project.optional-dependencies]
dev = [
    # testing
    "coverage>=5",
    "pytest>=6",
    "pytest-cov>=2.10.1",
    "pytest-filedata>=1.0.0",
    # utilities
    "jinja2>=2",
    "tmpl>=1",
    # A floor, not a pin: which twine actually runs comes from uv.lock. ctl's
    # pypi plugin imports twine as a library and twine <7 rejects
    # Metadata-Version 2.5, so an older one cannot publish what a current build
    # backend produces (#46). Nothing here feeds the release gate — that builds
    # its own environment from the publish action's requirements at the pinned
    # action ref (ci/publisher_metadata_gate.py), so it cannot drift from the
    # publisher no matter what this line says.
    "twine>=7",
    "PyYAML>1",
    "tomlkit<1",
    "setuptools>=65",
    # linting and formatting
    # Floors only. The single source of the ruff version is uv.lock, and
    # .pre-commit-config.yaml runs ruff out of this same environment, so the
    # local gate, GitLab CI and the GitHub checks job cannot disagree about it
    # whatever this floor allows (#43).
    "ruff>=0.1",
    "mypy>=0.950",
    "pre-commit>=2.13",
]
docs = [
    "markdown",
    "markdown-include>=0.5,<1",
    "mkdocs>=1.2.3",
    "pymdgen<2",
]

[project.scripts]
ctl = "ctl.cli:main"

[project.urls]
Homepage = "https://github.com/20c/ctl"
Repository = "https://github.com/20c/ctl"
Documentation = "https://ctl.readthedocs.io/en/latest"

[tool.uv]
# Build requirements resolve outside uv.lock, so `requires` below is the one
# place the lockfile cannot reach and the only thing that holds the backend
# still. It is not cosmetic: hatchling decides the Metadata-Version of what we
# publish (1.27 emits 2.4, 1.32 emits 2.5), and the publish action's twine
# rejects anything newer than it understands — after trusted publishing has
# already authenticated, on a tag that cannot be re-run (#44). Moving this pin
# means re-running ci/publisher_metadata_gate.py: the publish action decides
# whether the new metadata version is publishable, and it gets the last word.
build-constraint-dependencies = ["hatchling==1.32.0"]

[build-system]
# Deliberately unpinned: this is what downstream sees when it builds our sdist,
# and pinning a backend for other people's builds is not ours to do. Our own
# builds are pinned by [tool.uv] build-constraint-dependencies above; read that
# as the real backend version, not this line.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctl"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [
    ".git",
    ".venv",
    ".tox",
    "__pycache__",
    "build",
    "dist",
    "tests/data",
]

[tool.ruff.lint]
extend-select = [
    "UP",  # pyupgrade
    "I",   # isort
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "C90", # mccabe complexity
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "T20", # flake8-print
]
ignore = [
    "E203",  # whitespace before ':'
    "E266",  # too many leading '#' for block comment
    "E501",  # line too long (handled by formatter)
    "N818",  # Exception naming (can be fixed incrementally)
    "F841",  # Unused local variables (can be fixed incrementally)
    "T201",  # Print statements (can be fixed incrementally)
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.per-file-ignores]
"src/ctl/plugins/__init__.py" = ["F401", "B023"]
"src/ctl/plugins/all.py" = ["F401", "F403"]
"src/ctl/config/__init__.py" = ["F403"]
"tests/**/*.py" = ["T201", "F841"]  # Allow print and unused variables in tests
# Pre-existing code style issues to be fixed incrementally
"src/ctl/__init__.py" = ["B006"]
"src/ctl/auth.py" = ["N801"]
"src/ctl/cli.py" = ["F821"]
"src/ctl/config/schema.py" = ["N801"]
"src/ctl/docs.py" = ["N801"]
"src/ctl/plugins/git.py" = ["B904"]
"src/ctl/plugins/log_alert.py" = ["B007"]
"src/ctl/plugins/release.py" = ["B904"]
"src/ctl/plugins/version_base.py" = ["B904"]
"src/ctl/plugins/walk_dir.py" = ["B007"]
"src/ctl/util/git.py" = ["B904"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
ignore_missing_imports = true
# Disable strict checks until type annotations are added
disable_error_code = ["var-annotated", "no-redef", "attr-defined", "arg-type", "assignment", "misc", "str-bytes-safe", "union-attr", "index", "name-defined", "valid-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".ctl", ".tox", ".venv", "data", "gen"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

fail_fast: false
exclude: |
    (?x)^(
        tests/data/.*
    )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
  # ruff runs from the project environment (uv.lock-resolved) rather than a
  # separately pinned pre-commit mirror, so the local gate, GitLab CI and the
  # GitHub checks job are all definitionally the same ruff.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --extra dev ruff check
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --extra dev ruff format --check
        language: system
        types_or: [python, pyi]
        require_serial: true
  # Temporarily disabled until type annotations are added
